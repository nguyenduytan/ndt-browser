name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install CI browser
        run: npx playwright-core install --with-deps chromium
      - name: Select CI browser
        shell: bash
        run: node --input-type=module -e "import { chromium } from 'playwright-core'; import { appendFileSync } from 'node:fs'; appendFileSync(process.env.GITHUB_ENV, 'NDT_BROWSER_PATH=' + chromium.executablePath() + '\n');"
      - run: npm test
      - run: npm run test:types
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t ndt-browser:test .
      - run: docker run --rm --init --shm-size=1g --security-opt seccomp=./docker/seccomp_profile.json ndt-browser:test
      - run: docker run --rm --init --shm-size=1g --security-opt seccomp=./docker/seccomp_profile.json ndt-browser:test xvfb-run -a node test/docker-smoke.mjs
